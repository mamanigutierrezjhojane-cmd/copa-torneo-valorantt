<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Ejercico 1 - Portal E-Commerce Gamer</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body>
    <div class='container py-5'>
        <nav class='navbar navbar-expand-lg'>
            <div class='container-fluid flex-column align-items-start'>
                <div class='d-flex justify-content-between align-items-center w-100'>
                    <a class='navbar-brand fw-bold text-warning' href='#'>
                        ⚡ CYBERTECH
                    </a>
                    <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#menu' aria-controls='menu' aria-expanded='false' aria-label='Abrir menú'>
                        <span class='navbar-toggler-icon'></span>
                    </button>
                </div>
                <div class='collapse navbar-collapse' id='menu'>
                    <div class='navbar-nav'>
                        <a class='nav-link text-warning' href='#inicio'>Inicio</a>
                        <a class='nav-link text-secondary' href='#catalogo'>Catálogo</a>
                    </div>
                </div>
            </div>
        </nav>
        <header class='text-center py-4' id='inicio'>
            <h1 class='display-4 fw-bold text-warning'>
                CYBERTECH 2026
            </h1>
            <p class='lead fst-italic'>
                Componentes y periféricos gamer de última generación.
            </p>
        </header>
        <section id='catalogo' class='row g-3'>
            <div class='col-12'>
                <div class='card border-0 shadow-sm text-center'>
                    <div class='card-body'>
                        <small class='text-secondary'>NUEVO</small>
                        <h5 class='fw-bold'>Laptop Pro Gaming 16"</h5>
                        <h2 class='fw-bold text-success'>$1,299</h2>
                        <button class='btn btn-outline-secondary btn-sm w-100'>
                            Añadir al Carrito
                        </button>
                    </div>
                </div>
            </div>
            <div class='col-12'>
                <div class='card border-0 shadow-sm text-center'>
                    <div class='card-body'>
                        <small class='text-secondary'>OFERTA</small>
                        <h5 class='fw-bold'>Monitor 240Hz 1ms</h5>
                        <h2 class='fw-bold text-success'>$349</h2>
                        <button class='btn btn-outline-secondary btn-sm w-100'>
                            Añadir al Carrito
                        </button>
                    </div>
                </div>
            </div>
            <div class='col-12'>
                <div class='card border-0 shadow-sm text-center'>
                    <div class='card-body'>
                        <small class='text-secondary'>TOP</small>
                        <h5 class='fw-bold'>Teclado Mecánico RGB</h5>
                        <h2 class='fw-bold text-success'>$89</h2>
                        <button class='btn btn-outline-secondary btn-sm w-100'>
                            Añadir al Carrito
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js'></script>
</body>
</html>
